<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Add Note Bundle</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

  <!-- Security Access Denied Screen -->
  <div id="deniedScreen" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md text-center mt-12">
    <h2 class="text-xl font-bold text-red-600 mb-2">🔒 Access Denied</h2>
    <p class="text-sm text-gray-600">You do not have permission to access this upload portal directly.</p>
  </div>

  <!-- Admin Form -->
  <div id="adminFormContainer" class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md hidden">
    <h1 class="text-xl font-bold mb-4 text-gray-800">➕ Add New Note Bundle</h1>

    <form id="noteForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Subject</label>
        <input type="text" id="subject" placeholder="e.g. Science, History" class="w-full border p-2 rounded mt-1 outline-none focus:ring-2 focus:ring-blue-500" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Bundle Title</label>
        <input type="text" id="title" placeholder="e.g. O/L Science - Units 1, 2 & 3 Notes" class="w-full border p-2 rounded mt-1 outline-none focus:ring-2 focus:ring-blue-500" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Description</label>
        <textarea id="description" placeholder="Brief summary..." class="w-full border p-2 rounded mt-1 outline-none focus:ring-2 focus:ring-blue-500" rows="2"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Price (LKR)</label>
        <input type="number" id="price" placeholder="350" class="w-full border p-2 rounded mt-1 outline-none focus:ring-2 focus:ring-blue-500" required>
      </div>

      <!-- PUBLIC SAMPLE / PREVIEW LINK -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Sample Preview PDF Link (Public - First 2-3 Pages)</label>
        <input type="url" id="previewUrl" placeholder="https://drive.google.com/file/d/.../view" class="w-full border p-2 rounded mt-1 outline-none focus:ring-2 focus:ring-blue-500" required>
      </div>

      <!-- FULL LOCKED PDF LINK -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Full Paid PDF Storage Link (Private Document)</label>
        <input type="url" id="pdfUrl" placeholder="https://drive.google.com/file/d/.../view" class="w-full border p-2 rounded mt-1 outline-none focus:ring-2 focus:ring-blue-500" required>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition">
        Publish Note to Store
      </button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Secret key for admin access
    const SECRET_KEY = "admin1234"; 

    const urlParams = new URLSearchParams(window.location.search);
    const providedKey = urlParams.get('key');

    if (providedKey === SECRET_KEY) {
      document.getElementById('deniedScreen').classList.add('hidden');
      document.getElementById('adminFormContainer').classList.remove('hidden');
    } else {
      document.getElementById('deniedScreen').classList.remove('hidden');
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCOPEfTlcktSv7QluO-GR5WGrh1G2Eh5Cg",
      authDomain: "short-notes-2e6da.firebaseapp.com",
      databaseURL: "https://short-notes-2e6da-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "short-notes-2e6da",
      storageBucket: "short-notes-2e6da.firebasestorage.app",
      messagingSenderId: "906989363134",
      appId: "1:906989363134:web:f7e49da044b5b0cfe763ef",
      measurementId: "G-GF26VH6ECD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('noteForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const subject = document.getElementById('subject').value.trim();
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const price = Number(document.getElementById('price').value);
      const previewUrl = document.getElementById('previewUrl').value.trim();
      const pdfUrl = document.getElementById('pdfUrl').value.trim();

      const noteId = subject.toLowerCase().replace(/[^a-z0-9]/g, '') + '_' + Date.now();

      set(ref(db, 'notes/' + noteId), {
        id: noteId,
        subject: subject,
        title: title,
        description: description,
        price: price,
        previewUrl: previewUrl,
        pdfUrl: pdfUrl,
        timestamp: new Date().toISOString()
      }).then(() => {
        alert("Note bundle published successfully!");
        document.getElementById('noteForm').reset();
      }).catch((err) => {
        alert("Error adding note: " + err.message);
      });
    });
  </script>
</body>
</html>
